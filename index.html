<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Website Mas Bahlil</title>
    <style>
        body { text-align: center; font-family: sans-serif; background: #f0f0f0; }
        #gate { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 100; }
        .btn-grid { display: grid; grid-template-columns: 100px 100px; gap: 10px; justify-content: center; margin-top: 20px; }
        .btn { padding: 20px; font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <!-- Gerbang Password -->
    <div id="gate">
        <h1>Masukkan Password</h1>
        <div class="btn-grid">
            <button class="btn" onclick="check(1)">1</button>
            <button class="btn" onclick="check(2)">2</button>
        </div>
        <p id="status"></p>
    </div>

    <!-- Halaman Utama -->
    <div id="main" style="display:none;">
        <h1>Mas Bahlil Ganteng</h1>
        <audio id="myAudio" loop>
            <source src="lagu.mp3" type="audio/mpeg">
        </audio>
    </div>

    <script>
        let pass = "";
        const target = "1122";

        function check(num) {
            pass += num;
            if (pass.length === 4) {
                if (pass === target) {
                    document.getElementById('gate').style.display = 'none';
                    document.getElementById('main').style.display = 'block';
                    document.getElementById('myAudio').play(); // Musik otomatis putar
                } else {
                    alert("Password Salah!");
                    pass = "";
                }
            }
        }

        // Mencegah keluar halaman
        window.onbeforeunload = function() { return "Apakah Anda yakin ingin keluar?"; };
    </script>
</body>
</html>
